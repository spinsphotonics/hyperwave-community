Council. In 1845 in the Treaty of Purchase, which transferred Serampore College from the Danish government to the British, it was provided that the rights and immunities of the Serampore College should not be interfered with. Thus, the College has been in existence for more than 200 years. The College has secular and theological education coexisting on its campus from the beginning. The secular wing of Arts, Science, and Commerce is affiliated to Calcutta University. The theology department functions in its own right as a teaching institution in theology. The Senate of Serampore College is the theological wing of Serampore College, created in 1918, through the Serampore College Act 1918 passed by the West Bengal Government and the Charter. The Act empowers the Senate to frame courses of studies and make rules for the conduct of examinations with the approval of the Council. The aims and objectives of theological education are to equip the people of God in their respective contexts, to live out the doxological-liturgical, koinonia, reflective, diaconal, and missional dimensions of their existence, with a deep commitment to liberate the marginalised people \u2013 Dalits, Adivasis, Tribals, women, disabled, HIV and AIDS, LGBTQIA+. The Senate has been serving as a centre for theological training for the ministry of the Church in India and the neighbouring countries in South Asia \u2013 Sri Lanka, Bangladesh, and Nepal. The Senate of Serampore College desires that the services of Serampore College as a University should be available to all theological institutions that wish to become an integral part of the University as affiliated colleges. Currently, the Senate has 71 affiliated Colleges\/Seminaries from across the Churches\u2019 denominations and ecumenical. Thus, it is indeed very ecumenical in nature and practice. It confers the degrees in B.Th., BMiss, BD, BCS, BBT, MCS, MCP, CPC, MTh, D.Min, and D.Th (PhD). It also confers diplomas in Christian studies (Dip.C.S), Clinical Pastoral Counselling (D.C.P.C), Dip.B.T, Dip. Worship &amp;amp; Music (DWM), Dip.Contextual Theology (DipCT), and Dip. Christian Education (Dip.CE). More than 15,000 students are enrolled in different programs in different affiliated colleges.&lt;\/p&gt;&quot;,&quot;registrar_image&quot;:&quot;\/storage\/settings\/3OTdRs6SWlDd0L3FYmQKAO1KDxRCQkCOtAqVISI6.jpg&quot;,&quot;site_logo&quot;:&quot;\/storage\/settings\/nS7riCKpNdiKTEDzRL7Ni5SA6Przjzs47QojYftE.png&quot;,&quot;site_favicon&quot;:&quot;\/storage\/settings\/1dLwYb13CKtHaWEep9wXenZxUZAAhfzQny5zHjNK.png&quot;},&quot;marquee_notices&quot;:[{&quot;id&quot;:2,&quot;text&quot;:&quot;Final Results(With Re-Evaluation) of April 2026 Qualifying Examination Declared&quot;,&quot;url&quot;:&quot;\/final-result-april-2026&quot;,&quot;is_external&quot;:false,&quot;badge_text&quot;:&quot;RESULTS&quot;,&quot;badge_color&quot;:&quot;emerald&quot;,&quot;sort_order&quot;:1,&quot;is_active&quot;:true,&quot;starts_at&quot;:null,&quot;expires_at&quot;:null,&quot;created_at&quot;:&quot;2026-08-26T15:02:10.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-26T15:04:46.000000Z&quot;},{&quot;id&quot;:7,&quot;text&quot;:&quot;MTH, MCP, BD, BTH, BMISS, DWM, DCPC &amp; DMIN COMPREHENSIVE FINAL RESULT &amp; RE-EVALUATION MARK (APRIL 2026 EXAMINATIONS) HAS BEEN SENT TO RESPECTIVE COLLEGES&quot;,&quot;url&quot;:null,&quot;is_external&quot;:false,&quot;badge_text&quot;:&quot;CIRCULAR&quot;,&quot;badge_color&quot;:&quot;amber&quot;,&quot;sort_order&quot;:2,&quot;is_active&quot;:true,&quot;starts_at&quot;:null,&quot;expires_at&quot;:null,&quot;created_at&quot;:&quot;2026-08-26T15:06:48.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-26T15:06:48.000000Z&quot;}]},&quot;url&quot;:&quot;\/royal-charter\/&quot;,&quot;version&quot;:&quot;31506850f3aad6f57f24fdd432469fa1&quot;,&quot;clearHistory&quot;:false,&quot;encryptHistory&quot;:false}"></div>

                        loader.style.opacity = '0';
                        loader.style.visibility = 'hidden';
                        setTimeout(function() {
                            if (loader && loader.parentNode) {
                                loader.parentNode.removeChild(loader);
                            }
                        }, 300);
                    }
                }

                if (document.readyState === 'complete') {
                    removeLoader();
                } else {
                    window.addEventListener('load', removeLoader);
                    // Fallback safety timeout in case load event was delayed
                    setTimeout(removeLoader, 1500);
                }
            })();
        </script>
    </body>
</html>

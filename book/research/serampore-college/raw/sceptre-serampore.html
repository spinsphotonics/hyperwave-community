    <link rel="shortcut icon" href="https://sceptre.senateofseramporecollege.edu.in/storage/uploads/favicon_d73095fd-b0a0-4e1c-8f57-40c908d17abd.png">
        <link rel="preload" as="style" href="https://sceptre.senateofseramporecollege.edu.in/build/assets/app-C-YA_yB7.css" /><link rel="preload" as="style" href="https://sceptre.senateofseramporecollege.edu.in/build/assets/main-D8xBziat.css" /><link rel="modulepreload" as="script" href="https://sceptre.senateofseramporecollege.edu.in/build/assets/main-BQSa5AsP.js" /><link rel="stylesheet" href="https://sceptre.senateofseramporecollege.edu.in/build/assets/app-C-YA_yB7.css" /><link rel="stylesheet" href="https://sceptre.senateofseramporecollege.edu.in/build/assets/main-D8xBziat.css" /><script type="module" src="https://sceptre.senateofseramporecollege.edu.in/build/assets/main-BQSa5AsP.js"></script></head>
<body>
    <div id="root">
        <style>
            .initial-loader-wrap {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: linear-gradient(135deg, #0f1824 0%, #1a2738 50%, #0f1824 100%);
                color: #ffffff;
                font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
                z-index: 99999;
            }
            .initial-spinner-ring {
                width: 88px;
                height: 88px;
                border-radius: 9999px;
                border: 2.5px solid rgba(234, 191, 82, 0.15);
                border-top-color: #eabf52;
                border-right-color: rgba(243, 209, 121, 0.6);
                animation: initial-spin 1.2s linear infinite;
            }
            .initial-loader-logo {
                position: absolute;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 52px;
                height: 52px;
                border-radius: 16px;
                background: #24354b;
                color: #f3d179;
                box-shadow: 0 0 30px rgba(73, 104, 142, 0.45);
                overflow: hidden;
                padding: 6px;
            }
            .initial-loader-bar {
                width: 140px;
                height: 3px;
                border-radius: 9999px;
                background: rgba(255, 255, 255, 0.1);
                overflow: hidden;
                margin-top: 20px;
                position: relative;
            }
            .initial-loader-bar::after {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                height: 100%;
                width: 50%;
                background: #eabf52;
                border-radius: 9999px;
                animation: initial-bar 1.4s ease-in-out infinite;
            }
            @keyframes initial-spin {
                to { transform: rotate(360deg); }
            }
            @keyframes initial-bar {
                0% { transform: translateX(-100%); }
                100% { transform: translateX(300%); }
            }
        </style>
        <div class="initial-loader-wrap">
            <div style="position: relative; display: flex; align-items: center; justify-content: center;">
                <div class="initial-spinner-ring"></div>
                <div class="initial-loader-logo">
                                            <img src="https://sceptre.senateofseramporecollege.edu.in/storage/uploads/logo_7f5a9081-ba71-4b2f-ab1b-266325c902ab.png" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;" />
                                    </div>
            </div>
            <div style="margin-top: 20px; font-weight: 700; font-size: 18px; letter-spacing: 0.1em; color: #ffffff;">SCEPTRE</div>
            <div style="font-size: 10px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: #eabf52; margin-top: 4px;">Senate Centre for Extension and Pastoral Theological Research</div>
            <div class="initial-loader-bar"></div>
        </div>
    </div>

</body>
</html>
